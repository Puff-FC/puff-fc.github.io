<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<meta name="description" content="El diario de Puff FC: resultados, clasificación, jugadores y rivales.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puff FC">
<title>Diario Puff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Diario deportivo nerazzurro: azul y negro como el Inter, papel blanco, columnas densas. Un solo tema, a propósito. */
  --azul:#0b4fae; --azul-osc:#083b82; --tinta:#141414; --papel:#ffffff; --gris:#666a70; --linea:#e2e2e4; --fondo:#f2f2f3;
  --gana:#1f8a3b; --empata:#c98a00; --pierde:#c8202a;
  --f-titular:"Oswald","Arial Narrow",Arial,sans-serif; --f-texto:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.45}
a{color:var(--azul)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* Cabecera */
.cab{background:var(--papel);border-bottom:1px solid var(--linea)}
.cab .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:10px;flex-wrap:wrap}
.logo{font-family:var(--f-titular);font-weight:700;font-size:44px;line-height:.9;letter-spacing:-.5px;color:var(--azul);text-transform:uppercase;margin:0}
.logo span{color:var(--tinta)}
.cab-meta{font-size:13px;color:var(--gris);text-align:right}
.cab-meta b{color:var(--tinta)}
nav.menu{background:var(--tinta);position:sticky;top:0;z-index:5}
nav.menu .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav.menu .wrap::-webkit-scrollbar{display:none}
nav.menu button{background:none;border:0;color:#fff;font-family:var(--f-titular);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.menu button[aria-current="page"]{border-bottom-color:#fff;background:var(--azul)}
nav.menu button:hover{background:#2a2a2a}
/* Ticker */
.ticker{background:#0d1420;color:#fff}
.franja{height:6px;background:repeating-linear-gradient(90deg,var(--azul) 0 28px,var(--tinta) 28px 56px)}
.ticker .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:thin}
.tk{flex:0 0 auto;background:#1c2533;border-radius:3px;padding:5px 9px;font-size:13px;line-height:1.25;min-width:150px}
.tk .r{display:flex;justify-content:space-between;gap:10px}
.tk .n{white-space:nowrap}
.tk b{font-variant-numeric:tabular-nums}
.tk.puff{background:var(--azul)}
.tk-lab{flex:0 0 auto;font-family:var(--f-titular);text-transform:uppercase;font-size:13px;color:#bbb;align-self:center;padding-right:4px}
main{padding:18px 0 40px}
.vista{display:none}
.vista.activa{display:block}
/* Bloques */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g-port{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.g-port,.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.caja{background:var(--papel);border-top:4px solid var(--tinta);padding:14px 16px 16px}
.caja.roja{border-top-color:var(--azul)}
/* Bloques de Puff: franja nerazzurra arriba, fondo azulado y sello */
.caja.puff{position:relative;background:#eef4fc;border-top:0;padding-top:22px;box-shadow:inset 0 0 0 1px #d3e1f5}
.caja.puff::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,var(--azul) 0 22px,var(--tinta) 22px 44px)}
.sello{display:inline-block;background:var(--azul);color:#fff;font-family:var(--f-titular);font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin:0 6px 6px 0;vertical-align:middle}
.caja.puff .antetitulo{display:inline-block}
.g-port>article.caja{align-self:start}
.cronica p{margin:10px 0 0;max-width:68ch;font-size:16px}
.cronica h2{margin-top:4px;font-size:26px}
.cronica.en-portada{margin-top:14px;padding-top:12px;border-top:1px solid #c9d8ef}
.cronica.en-portada p{font-size:17px}
.asi-va{margin-top:18px;padding-top:12px;border-top:2px solid var(--tinta)}
.noticia-extra p{margin:10px 0 0;max-width:68ch;font-size:16px}
.noticia-extra h2{margin-top:4px;font-size:26px}
/* Resumen de jornada cuando Puff descansa */
.recap{margin-top:16px;display:grid;gap:12px}
.rc{border-top:1px solid #c9d8ef;padding-top:10px}
.rc .m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-family:var(--f-titular);font-weight:600;font-size:18px;text-transform:uppercase;line-height:1.1}
.rc .m span{min-width:0;overflow-wrap:anywhere}
.rc .m span:last-child{text-align:right}
@media (max-width:520px){.rc .m{font-size:15px}}
.rc .m b{background:var(--tinta);color:#fff;padding:1px 10px;border-radius:3px;font-variant-numeric:tabular-nums}
.rc p{margin:6px 0 0;font-size:16px;max-width:68ch}
.cronica.en-portada .cita p,.noticia-extra .cita p,.cronica .cita p{font-size:22px;margin:0}
.cita{margin:16px 0 0;padding:4px 0 4px 16px;border-left:5px solid var(--azul)}
.cita p{font-family:var(--f-titular);font-size:22px;font-weight:600;line-height:1.2;margin:0;color:var(--tinta)}
.cita footer{font-size:13px;color:var(--gris);margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
/* Portada: dos columnas que crecen por separado; en móvil se mezclan en orden de lectura */
.portadas{margin:0 0 14px}
.portada{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.col-izq,.col-der{display:grid;gap:16px;min-width:0}
@media (max-width:860px){.portada{grid-template-columns:minmax(0,1fr)}.col-izq,.col-der{display:contents}
 .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}}
@media (min-width:1400px){.wrap{max-width:1300px}}
.antetitulo{font-family:var(--f-titular);text-transform:uppercase;color:var(--azul);font-size:14px;letter-spacing:.5px;margin:0 0 4px}
h1,h2,h3{font-family:var(--f-titular);text-wrap:balance;margin:0;line-height:1.08}
h1.titular{font-size:clamp(30px,5vw,48px);font-weight:700}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:600}
.entradilla{font-size:18px;color:#333;margin:10px 0 0;max-width:65ch}
.sec-tit{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid var(--tinta);padding-bottom:4px;margin:0 0 12px}
.sec-tit h2{font-size:20px;text-transform:uppercase}
.nota{font-size:13px;color:var(--gris)}
.lista-noticias{display:grid;gap:12px}
.noticia{border-bottom:1px solid var(--linea);padding-bottom:12px}
.noticia:last-child{border-bottom:0;padding-bottom:0}
.noticia p{margin:4px 0 0;color:#333;font-size:15px}
/* Marcador grande */
.marcador{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 6px}
.marcador .eq{font-family:var(--f-titular);font-size:20px;font-weight:600;text-transform:uppercase;flex:1 1 0;min-width:0;text-align:center;overflow-wrap:anywhere}
.marcador .res{font-family:var(--f-titular);font-size:44px;font-weight:700;background:var(--tinta);color:#fff;padding:2px 16px;border-radius:3px;font-variant-numeric:tabular-nums}
/* Tablas */
.tabla-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-titular);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.3px;color:var(--gris);text-align:center;padding:6px 6px;border-bottom:2px solid var(--tinta);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}
td.izq,th.izq{text-align:left}
tr.es-puff td{background:#e8f0fb;font-weight:700}
/* Tabla de jugadores: nombre fijo al hacer scroll lateral y bloque desplegable */
#tabla-jug th:first-child,#tabla-jug td:first-child{position:sticky;left:0;z-index:1;background:var(--papel)}
details.desplegable>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--tinta);padding-bottom:4px}
details.desplegable>summary::-webkit-details-marker{display:none}
details.desplegable>summary h2{font-size:20px;text-transform:uppercase}
details.desplegable>summary h2::after{content:" +";color:var(--azul)}
details.desplegable[open]>summary h2::after{content:" \2212"}
details.desplegable[open]>summary{margin-bottom:12px}
th button{background:none;border:0;color:inherit;font:inherit;text-transform:inherit;padding:0;letter-spacing:inherit}
th button[aria-sort]{color:var(--azul)}
.pos{font-weight:700;width:26px}
.zona{display:inline-block;width:4px;height:16px;vertical-align:middle;margin-right:6px;background:transparent}
.zona.top{background:var(--azul)}
/* Chips de forma */
.forma{display:inline-flex;gap:3px}
.f{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:2px;color:#fff;font-size:11px;font-weight:700;font-family:var(--f-titular)}
.f.V{background:var(--gana)}.f.E{background:var(--empata)}.f.D{background:var(--pierde)}
/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.cifra{border-left:3px solid var(--azul);padding:2px 0 2px 10px}
.cifra .v{font-family:var(--f-titular);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cifra .l{font-size:13px;color:var(--gris)}
.cifra .d{font-size:12px;font-weight:700}
.sube{color:var(--gana)}.baja{color:var(--pierde)}.igual{color:var(--gris)}
/* Selectores */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{background:var(--papel);border:1px solid var(--linea);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip:hover{border-color:var(--tinta)}
/* Partidos */
.partidos{display:grid;gap:6px}
.pt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;border-bottom:1px solid var(--linea);padding:6px 0}
.pt:last-child{border-bottom:0}
.pt .j{font-family:var(--f-titular);color:var(--gris);font-size:13px}
.pt .vs{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pt .sc{font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.pendiente{color:var(--gris);font-weight:400}
.barra{height:8px;background:var(--fondo);border-radius:2px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--azul)}
svg text{font-family:var(--f-texto);fill:var(--gris);font-size:11px}
.graf{width:100%;display:block}
.btn{background:var(--azul);color:#fff;border:0;border-radius:3px;padding:10px 16px;font-family:var(--f-titular);text-transform:uppercase;font-weight:600;letter-spacing:.4px}
.btn.sec{background:var(--tinta)}
.btn:hover{background:var(--azul-osc)}
.datos{margin:12px 0 0;display:grid}
.datos .fila{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--linea);align-items:baseline}
.datos .fila:last-child{border-bottom:0}
.datos dt{font-family:var(--f-titular);text-transform:uppercase;font-size:12px;letter-spacing:.4px;color:var(--gris);margin:0}
.datos dd{margin:0;font-weight:600}
.datos dd small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.clave{font-size:17px;margin:10px 0 0;max-width:60ch}
.conviene{margin:12px 0 0;padding:10px 12px;background:#e8f0fb;border-left:4px solid var(--azul);font-weight:600}
.aviso{background:#fff6e0;border:1px solid #f0d48a;padding:10px 12px;font-size:14px;border-radius:3px}
footer{font-size:12px;color:var(--gris);padding:0 0 30px}
/* ---------- Capa de app ---------- */
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:56px;height:56px;flex:none}
.tabbar,.instalar,.cab-corta{display:none}
@media (max-width:860px){
  html,body{overscroll-behavior-y:none}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .cab{background:#0d1420;border-bottom:0;padding-top:env(safe-area-inset-top)}
  .cab .wrap{align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:nowrap;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .marca{gap:10px}.marca img{width:40px;height:40px}
  .logo{font-size:26px;color:#fff;white-space:nowrap}
  .portadas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.portadas::-webkit-scrollbar{display:none}.portadas .chip,.portadas .nota{flex:none}.logo span{color:#6fa3ec}
  .cab-meta{font-size:11px;color:#9aa6b8;text-align:right;line-height:1.3}.cab-meta b{color:#fff}
  nav.menu{display:none}
  .cab-larga{display:none}.cab-corta{display:inline}.cab-meta{font-size:12px;white-space:nowrap}.cab-meta>b,.cab-meta>br{display:none}
  main{padding-top:14px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0d1420;border-top:1px solid #1f2a3a;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .tabbar button{background:none;border:0;color:#8f9bb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:6px 2px;font-family:var(--f-titular);font-size:11px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;position:relative}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current="page"]{color:#fff}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(90deg,#2f7bf0 0 6px,#fff 6px 8px)}
  .instalar{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:21;background:#fff;color:var(--tinta);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:12px 12px 12px 14px;align-items:center;gap:12px;font-size:14px;line-height:1.35}
  .instalar.ver{display:flex}
  .instalar img{width:40px;height:40px;flex:none}
  .instalar p{margin:0;flex:1}
  .instalar b{font-family:var(--f-titular);text-transform:uppercase;font-size:15px;letter-spacing:.3px;display:block}
  .instalar .btn{padding:8px 12px;font-size:14px}
  .instalar .cerrar{background:none;border:0;color:var(--gris);font-size:22px;line-height:1;padding:4px 6px;min-width:36px;min-height:36px}
}
@media (max-width:520px){.logo{font-size:34px}.cab-meta{text-align:left}.marcador .res{font-size:34px;padding:2px 10px}.marcador .eq{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.vista.activa{animation:entra .18s ease-out}@keyframes entra{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<header class="cab"><div class="wrap">
  <div class="marca"><p class="logo">Diario <span>Puff</span></p></div>
  <div class="cab-meta" id="cab-meta"></div>
</div></header>
<div class="franja" aria-hidden="true"></div>
<nav class="menu" aria-label="Secciones"><div class="wrap" id="menu"></div></nav>
<div class="ticker" aria-label="Última jornada"><div class="wrap" id="ticker"></div></div>
<main><div class="wrap">
  <section class="vista" id="v-portada"></section>
  <section class="vista" id="v-puff"></section>
  <section class="vista" id="v-jugadores"></section>
  <section class="vista" id="v-liga"></section>
  <section class="vista" id="v-rivales"></section>
</div></main>
<footer><div class="wrap" id="pie"></div></footer>
<nav class="tabbar" id="tabbar" aria-label="Secciones"><button data-v="portada"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h12v14H6.5A2.5 2.5 0 0 1 4 16.5z"/><path d="M16 9h4v8.5a1.5 1.5 0 0 1-3 0V9"/><path d="M7 9h6M7 12.5h6M7 16h4"/></svg>Portada</button><button data-v="puff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M9.5 7.5v9M14.5 7.5v9"/></svg>Puff FC</button><button data-v="jugadores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5L3 6.5l2 4 2-1V20h10V9.5l2 1 2-4-5.5-3c-.6 1.6-1.9 2.6-3.5 2.6s-2.9-1-3.5-2.6z"/></svg>Jugadores</button><button data-v="liga"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4.5a3 3 0 0 0 3.3 3.4M16.5 6h3a3 3 0 0 1-3.3 3.4M12 13.5V17M8.5 20.5h7M10 17h4v3.5h-4z"/></svg>Liga</button><button data-v="rivales"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>Rivales</button></nav>

os":3,"porteria_a_0":0,"mvp":null},{"jornada":3,"jugador":"Cañas","jugado":1,"goles":1,"asistencias":1,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":3,"porteria_a_0":0,"mvp":null},{"jornada":3,"jugador":"Claudio","jugado":1,"goles":1,"asistencias":1,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":3,"porteria_a_0":0,"mvp":null},{"jornada":3,"jugador":"Travis","jugado":1,"goles":1,"asistencias":1,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":3,"porteria_a_0":0,"mvp":null},{"jornada":3,"jugador":"Gabri","jugado":1,"goles":0,"asistencias":1,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":3,"porteria_a_0":0,"mvp":null},{"jornada":3,"jugador":"Diego","jugado":1,"goles":1,"asistencias":0,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":3,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"Mikel","jugado":1,"goles":0,"asistencias":0,"amarillas":0,"rojas":0,"partes_porteria":1,"goles_encajados":2,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"Cañas","jugado":1,"goles":1,"asistencias":0,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":2,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"César","jugado":1,"goles":1,"asistencias":0,"amarillas":2,"rojas":1,"partes_porteria":0,"goles_encajados":2,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"Gabri","jugado":1,"goles":0,"asistencias":0,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":2,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"Tito","jugado":1,"goles":0,"asistencias":0,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":2,"porteria_a_0":0,"mvp":null},{"jornada":5,"jugador":"Pedro","jugado":1,"goles":0,"asistencias":2,"amarillas":0,"rojas":0,"partes_porteria":0,"goles_encajados":2,"porteria_a_0":0,"mvp":null}],"cronicas":[{"jornada":1,"autor":"Juan","rol":"portero","contexto":"Audio de Juan: Puff superior todo el partido. La Colonia jugó de cinco (portero-jugador) casi todo el partido salvo al principio; costó defenderlo pero se defendió bien. Su gol fue un disparo desde la frontal que Juan reconoce que pudo parar. Poco peligro rival. Buen nivel para ser el primer partido. Campo pequeño y suelo que duele al caer.","titular":"Puff arranca ganando al juego de cinco de La Colonia","texto":["Primer partido de la temporada y primera victoria: 2-1 contra La Colonia Huertaña. Puff fue mejor durante todo el partido y lo dejó claro en el marcador con los goles de Cañas, a pase de Gabri, y de César.","La Colonia lo intentó jugando de cinco casi todo el partido, salvo en los primeros minutos. Costó cogerle el punto a defenderlo, pero el equipo lo resolvió bien y apenas pasó apuros. Su único gol llegó de un disparo desde la frontal, de esos que te pueden caer cuando el rival juega con portero-jugador.","Buenas sensaciones para ser el estreno, en un campo pequeño y con un suelo que no perdona cuando te tiras. Tres puntos a la saca y a seguir."],"cita":"Hemos jugado muy bien para ser el primer partido. Buenas sensaciones, más tres y a seguir."},{"jornada":2,"autor":"Juan","rol":"portero","contexto":"Audio de Juan: estreno en La Elipa ('nuestra casa'). Rival nuevo, algo más veterano, ni bueno ni malo. Abrió el partido Gabri con el mejor gol de la historia de Puff (pisadita y caño). Muy cómodos y dominando, 5-0 al descanso (Juan dijo '4-5-0', interpretado como 5-0). En la segunda parte aprietan y marcan; Puff sigue dominando y mete otro. Debut muy bueno de Mikel en portería.","titular":"Gabri firma el golazo de la historia de Puff en un 6-1 sin discusión","texto":["Puff se estrenó en La Elipa, la pista de siempre, la que nos ha visto llorar y reír, y lo hizo a lo grande: 6-1 a La Vida en Rosa. Un equipo nuevo en la liga, algo más veterano que nosotros, que no hizo un mal partido pero tampoco tuvo argumentos para frenar a Puff.","El partido arrancó con el que probablemente sea el mejor gol de la historia del club: Gabri, con una pisadita y un caño de esos que, si hubiera vídeo, no se vería otra cosa en toda la semana. A partir de ahí, dominio total y 5-0 al descanso.","En la segunda parte el rival apretó un poco y marcó su gol, pero Puff no perdió el control. Siguió tocando bien y cerró la goleada con el sexto. Además, debut con nota de Mikel bajo palos, que apunta a quedarse mucho tiempo."],"cita":"Buen debut de Mikel, porterazo. Viene para largo."},{"jornada":3,"autor":"Alberto","rol":"presidente","contexto":"Audio de Alberto: fueron 5 de milagro (Cañas mal del estómago, Travis llegó tarde cargando el coche). Defender bien y pasar fácil. Puff marca primero, empatan con un tiro que se cuela entre todos, 1-1 al descanso sin cambios. Alberto entra en la segunda parte; 2-1 antes de que llegue Travis; Travis entra y marca uno feo (3-1). Empatan 3-3 (mala suerte; Alberto se culpa de uno, no publicado). Diego marca el 3-4 con una jugada increíble y se sufre hasta el final. Nunca fueron por detrás. Confirmado por Pedro: Mikel fue el único portero (encajó los 3) y Alberto, que es portero, jugó en pista por necesidad.","titular":"Puff gana con lo justo, mucho sufrimiento y un golazo final de Diego","texto":["Puff llegó a Palomeras con cinco jugadores y de milagro. Cañas tenía el estómago en pie de guerra y Travis seguía de camino, terminando de cargar el coche. Así que tocó apretar los dientes: defender bien atrás, pasar fácil y no complicarse.","Funcionó. Puff se adelantó, y aunque Mejiyouns empató con un disparo que se coló entre todos, al descanso se llegó 1-1 y sin cambios, porque el banquillo era un concepto teórico. En la segunda parte salió Alberto y Puff volvió a ponerse por delante antes de que apareciera Travis, que entró y metió una de esas que no salen en los resúmenes pero valen igual: 3-1.","Mejiyouns no se rindió y empató 3-3, con algo de mala suerte en los goles. Entonces apareció Diego con una jugada increíble para el 3-4, y los últimos minutos fueron a puro sufrir. Pero nunca fuimos por detrás, y eso también dice mucho."],"cita":"Nunca se nos han puesto por delante. Hemos aguantado los últimos minutos a puro sufrir."},{"jornada":5,"autor":"Juan Sáenz","rol":"delegado de campo","contexto":"Audio de Juan (no jugó, llegó tarde desde Zaragoza): inicio dormido y paradón de Mikel, el mejor del arranque. 1-0 al descanso, gol bonito de Cañas con balones largos, jugando mejor que Taifa. Al empezar la segunda, buena jugada y 2-0 de César. Partido muy caliente, mucha bronca con el árbitro, grada de Taifa de unas 20 personas que según el equipo influyó en el árbitro. Puff se desconecta: buen gol de Taifa y otro de chiripa (rebote tras parada de Mikel que cae en la cabeza de un rival en la línea). 2-2. Muchas ocasiones falladas. Roja a César por perder tiempo (doble amarilla). Última jugada: contra de 3 para 1 pasado medio campo y el árbitro pita el final; el portero rival reconoció que fue una vergüenza cortarla y el árbitro luego dio explicaciones. Cierre: tres victorias y un empate en los cuatro primeros, se firmaba.","titular":"Puff se deja un 2-0 en un derbi caliente y se lleva un punto","texto":["El derbi estuvo a la altura, aunque Puff se fue a casa con la sensación de haber dejado escapar dos puntos. El equipo salió dormido y en esos primeros minutos apareció Mikel con una parada de las que se recuerdan, la que sostuvo a Puff hasta que entró en el partido.","Poco a poco Puff se hizo con el balón. Buscando a Cañas con balones largos llegó el 1-0, un gol bonito que mandó al equipo por delante al descanso y jugando mejor que Taifa. Nada más volver, otra buena jugada acabó en las botas de César, que está muy fino, para el 2-0. Pedro dio los dos pases de gol.","Ahí el partido se calentó. Hubo mucha discusión con el árbitro, y una grada de Taifa de unas veinte personas apretó todo el partido, y en el banquillo de Puff hay quien cree que también se notó en el silbato. Puff se desconectó unos minutos y Taifa lo aprovechó: primero con un buen gol y después con uno de pura fortuna, un rebote tras una parada de Mikel que le cayó en la cabeza a un rival en la línea. 2-2.","Puff volvió a ponerse serio y tuvo ocasiones de sobra, en jugadas individuales y colectivas, pero el balón no quiso entrar. En el tramo final César vio la segunda amarilla por retrasar un saque. Y en la última jugada, con una contra de tres para uno ya pasado el centro del campo, el árbitro pitó el final. Hasta el portero de Taifa admitió después que no era momento de cortar, y el propio árbitro se acercó a dar explicaciones.","Un punto que sabe a poco, pero el balance es bueno: tres victorias y un empate en cuatro partidos."],"cita":"Si a principio de temporada nos dicen tres victorias y un empate en los cuatro primeros, firmamos. A seguir."}],"noticias":[{"jornada":3,"tema":"Comité de Competición","titular":"El equipo legal de Puff tumba al Comité de Competición y recupera la victoria ante Mejiyouns","texto":["El Comité de Competición de la Liga Municipal de Moratalaz dio por ganador a Mejiyouns en el partido de la jornada 3, con un 4-3 que nadie en Palomeras recordaba haber visto. Puff no se quedó de brazos cruzados: su equipo legal presentó la apelación, el comité lo consultó con el árbitro y acabó rectificando. El 3-4 es oficial y los tres puntos se quedan en casa."],"cita":"Enhorabuena al equipo legal, que ha hecho un trabajazo. Han conseguido darle la vuelta a una situación que casi dábamos por perdida.","autor":"Pedro","rol":"presidente en funciones"},{"jornada":4,"tema":"Derbi","titular":"La afición de Puff no descansa: el derbi se calienta una semana antes","texto":["Puff tuvo el domingo libre, pero la grada no paró. Mientras el equipo veía la jornada desde el sofá, Taifa le ganaba 2-1 a Mejiyouns y se quedaba a tres puntos. Con eso bastó para que el grupo del equipo echara humo: ya circulan bocetos de pancarta, el departamento de seguridad del club ha rechazado las bengalas y se habla de un tifo azul y negro que nadie sabe quién va a pagar. La temporada pasada cada uno ganó un partido: 3-1 para Puff en la ida y 4-2 para ellos en la vuelta. El desempate se juega el domingo 22 a las 15:00 en Moratalaz."],"cita":"Que nadie se relaje por el descanso. Es el derbi y el domingo hay que salir a morder.","autor":"Jefe del grupo de animación","rol":""},{"jornada":4,"tema":"Directiva","titular":"Nadie le hace Bizum al presidente y vuelve a San Francisco sin pagar el alquiler","texto":["La comida de la directiva ha dejado un agujero en las cuentas del club. Alberto, presidente de Puff, pagó la comida confiando en que el resto le haría Bizum. Su móvil sigue sin vibrar. El presidente vuelve a San Francisco, donde vive de forma temporal, sin saber cómo va a pagar el alquiler este mes. Los cafés los pagó Cañas, que tampoco ha visto un euro y ya ha anunciado medidas."],"cita":"Es la última vez que pago los cafés. Lo del Bizum es una vergüenza.","autor":"Cañas","rol":"directivo"},{"jornada":5,"tema":"Comité de Competición","titular":"El Comité de Competición sanciona a César Cañadas con un partido y se perderá la visita a Liatrancas","texto":["La doble amarilla del derbi ya tiene consecuencias. El Comité de Competición de la Liga Municipal de Moratalaz ha sancionado con un partido a César Cañadas, que vio la segunda amarilla en el tramo final contra Taifa por retrasar un saque. El defensa se perderá el partido contra Liatrancas del domingo 29.","El equipo legal de Puff, que ya le ganó un pulso al Comité con el resultado de Mejiyouns, estudia el expediente. Fuentes del club reconocen que esta vez el recurso lo tienen más difícil. Lo que sí está asegurado es el relevo familiar: en el vestuario ya se da por hecho que Cañas tendrá que marcar por los dos hermanos."],"cita":"Solo estaba colocando el balón. Se ve que en Moratalaz eso ya es delito.","autor":"César Cañadas","rol":"defensa"}],"recaps":[{"jornada":4,"titular":"Puff descansa y sigue segundo: así fue la jornada 4","entradilla":"Sin Puff en pista, la jornada dejó cinco partidos y tres se decidieron por un gol. Fresquitos sigue con pleno y Borrachester se nos iguala a puntos.","partidos":[{"local":"Borrachester United FC","visitante":"C.Santos FC","frase":"Borrachester gana por la mínima y se nos pega a la chepa: mismos puntos que Puff y solo nos separa la diferencia de goles."},{"local":"Taifa ABC","visitante":"MEJIYOUNS","frase":"El rival del derbi cumple sin brillo y llega al domingo con 6 puntos. Mejiyouns sigue sin estrenar el casillero."},{"local":"UD Liatrancas","visitante":"LA VIDA EN ROSA FLORISTERIA NVMC F.S.","frase":"La Vida en Rosa se quita el mal sabor del 6-1 que le metimos con una manita a Liatrancas, que ya lleva 26 goles encajados."},{"local":"XYMAHO FC ACADEMY","visitante":"LA COLONIA HUERTAÑA","frase":"Xymaho gana lo justo y La Colonia vuelve a caer por la mínima, como contra nosotros en la jornada 1."},{"local":"A.D. Birras y Rosas","visitante":"Fresquitos FC","frase":"Fresquitos gana sin hacer ruido y sigue siendo el único con pleno: 4 de 4 y 26 goles a favor."}]}]},"anterior":{"temporada":"2025/26","liga":[{"jornada":1,"fecha":"2025-10-19","local":"Puff FC","goles_local":3.0,"visitante":"Taifa ABC","goles_visitante":1.0,"obs":""},{"jornada":1,"fecha":"2025-10-19","local":"ILEGALES","goles_local":3.0,"visitante":"VENTAS KINGS FC","goles_visitante":5.0,"obs":""},{"jornada":1,"fecha":"2025-10-19","local":"A.D.C. FILIPENSES","goles_local":0.0,"visitante":"M&M ASOCIADOS","goles_visitante":3.0,"obs":""},{"jornada":1,"fecha":"2025-10-19","local":"Fresquitos FC","goles_local":5.0,"visitante":"TRIL. AUPA PASOS GIGANTES","goles_visitante":3.0,"obs":""},{"jornada":1,"fecha":"2025-10-19","local":"La Quinta","goles_local":3.0,"visitante":"Pibes FC","goles_visitante":2.0,"obs":""},{"jornada":2,"fecha":"2025-10-26","local":"LA COLONIA HUERTAÑA","goles_local":1.0,"visitante":"ILEGALES","goles_visitante":5.0,"obs":""},{"jornada":2,"fecha":"2025-12-07","local":"Pibes FC","goles_local":3.0,"visitante":"Puff FC","goles_visitante":3.0,"obs":"Partido aplazado de la Jornad function grafGoles(ps){
  if(!ps.length)return "";const W=560,H=170,ml=10,mt=14,mb=30,maxG=Math.max(4,...ps.map(p=>Math.max(p.gf,p.gc)));
  const bw=Math.min(40,(W-2*ml)/ps.length);const half=bw/2-2;const y0=H-mb;const sc=v=>v*(H-mt-mb)/maxG;
  let g=`<line x1="${ml}" x2="${W-ml}" y1="${y0}" y2="${y0}" stroke="#c9c9cc"/>`;
  ps.forEach((p,i)=>{const cx=ml+i*bw+bw/2;
    g+=`<rect x="${cx-half}" y="${y0-sc(p.gf)}" width="${half}" height="${sc(p.gf)}" fill="#0b4fae"/><text x="${cx-half/2}" y="${y0-sc(p.gf)-3}" text-anchor="middle" style="fill:#141414">${p.gf}</text>`;
    g+=`<rect x="${cx+1}" y="${y0-sc(p.gc)}" width="${half}" height="${sc(p.gc)}" fill="#141414"/><text x="${cx+1+half/2}" y="${y0-sc(p.gc)-3}" text-anchor="middle">${p.gc}</text>`;

  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Goles a favor y en contra por partido">${g}</svg><p class="nota">Azul: goles a favor. Negro: en contra.</p>`;
}

/* ---------- Titulares con guasa ---------- */
function titularPuff(){
  const u=PUFF_PS[PUFF_PS.length-1];if(!u)return {ante:"Puff FC",t:"Arranca la temporada",e:""};
  const dif=u.gf-u.gc, r=corto(u.rival), pos=posDe(PUFF), b=balance(PUFF_PS), rs=racha(PUFF_PS);
  let t;
  if(dif>=4)t=`Puff le pasa por encima a ${r}: ${u.gf}-${u.gc} y a otra cosa`;
  else if(dif>=2)t=`Puff despacha a ${r} sin despeinarse (${u.gf}-${u.gc})`;
  else if(dif===1)t=`Puff sufre lo justo y gana a ${r} (${u.gf}-${u.gc})`;
  else if(dif===0)t=`Reparto de puntos con ${r} (${u.gf}-${u.gc}) y aquí paz y después gloria`;
  else if(dif>=-2)t=`Puff tropieza con ${r} (${u.gf}-${u.gc}) y toca levantarse`;
  else t=`${r} le da un repaso a Puff (${u.gc}-${u.gf}). Mejor no ver el vídeo`;
  const cr=(A.cronicas||[]).find(c=>c.jornada===u.j);
  if(cr&&cr.titular)t=cr.titular;
  let e=`Puff es ${pos}º con ${b.pts} ${plural(b.pts,"punto","puntos")} en ${b.pj} ${plural(b.pj,"partido","partidos")}: ${txtBal(b).replace(/ \(.*\)$/,"")}.`;
  if(rs&&rs.res==="V"&&rs.n>=3)e+=` Lleva ${rs.n} victorias seguidas y ya hay quien pregunta por el precio de las bufandas.`;
  else if(rs&&rs.res==="D"&&rs.n>=2)e+=` Son ${rs.n} derrotas seguidas: el vestuario pide calma y alguna caña.`;
  if(pos===1)e+=" Líder. Que alguien haga una captura.";
  else if(pos<=3)e+=" En la pomada, mirando al líder de reojo.";
  return {ante:`Jornada ${u.j} · ${fechaLarga(u.fecha)}`,t,e,u};
}
function noticiasLiga(){
  const N=[];const lid=TAB[0];

  if(lid.eq!==PUFF)N.push({a:"Liderato",t:`${corto(lid.eq)} manda con ${lid.pts} puntos`,p:`${txtBal({pj:lid.pj,v:lid.pg,e:lid.pe,d:lid.pp,gf:lid.gf,gc:lid.gc}).replace(/ \(.*\)$/,"")} y ${lid.gf} goles a favor, ${fmt(lid.gf/Math.max(1,lid.pj))} por partido. Ritmo de apisonadora.`});
  else N.push({a:"Liderato",t:`Puff, líder con ${lid.pts} puntos`,p:"No es un sueño. Bueno, puede que sí, pero la tabla dice lo que dice."});
  const gole=ultimos.filter(m=>m.local!==PUFF&&m.visitante!==PUFF).sort((a,b)=>Math.abs(b.goles_local-b.goles_visitante)-Math.abs(a.goles_local-a.goles_visitante)||(b.goles_local+b.goles_visitante)-(a.goles_local+a.goles_visitante))[0];
  if(gole){const dif=Math.abs(gole.goles_local-gole.goles_visitante);
    if(dif===0)N.push({a:"El partido de la jornada",t:`${corto(gole.local)} y ${corto(gole.visitante)} empatan a ${gole.goles_local}`,p:"Nadie se llevó el gato al agua."});
    else{const gl=gole.goles_local>gole.goles_visitante;N.push({a:dif>=4?"Goleada de la jornada":"El resultado más amplio de la jornada",t:`${corto(gl?gole.local:gole.visitante)} ${Math.max(gole.goles_local,gole.goles_visitante)}-${Math.min(gole.goles_local,gole.goles_visitante)} a ${corto(gl?gole.visitante:gole.local)}`,p:dif>=4?"Hay marcadores que se cuentan solos.":"Sin goleadas esta vez, pero alguien se fue a casa contento."});}}
  const emp=ultimos.filter(m=>m.goles_local===m.goles_visitante&&m!==gole);
  if(emp.length)N.push({a:"Reparto de puntos",t:emp.map(m=>`${corto(m.local)} ${m.goles_local}-${m.goles_visitante} ${corto(m.visitante)}`).join(" · "),p:`${emp.length===1?"Un empate":emp.length+" empates"} en la jornada ${ULT_J}.`});
  const rachas=TAB.map(x=>({eq:x.eq,r:racha(partidosDe(A.liga,x.eq))})).filter(x=>x.r&&x.r.res==="V"&&x.eq!==PUFF).sort((a,b)=>b.r.n-a.r.n);
  if(rachas[0]&&rachas[0].r.n>=2)N.push({a:"En racha",t:`${corto(rachas[0].eq)} encadena ${rachas[0].r.n} victorias`,p:`Ojo con ellos: ${posDe(rachas[0].eq)}º en la tabla.`});
  const ult=TAB[TAB.length-1];N.push({a:"Farolillo rojo",t:`${corto(ult.eq)} cierra la tabla con ${ult.pts} ${plural(ult.pts,"punto","puntos")}`,p:`${ult.gc} ${plural(ult.gc,"gol encajado","goles encajados")} en ${ult.pj} ${plural(ult.pj,"partido","partidos")}. Ánimo, que la liga es larga.`});
  const def=[...TAB].filter(x=>x.pj).sort((a,b)=>a.gc/a.pj-b.gc/b.pj)[0];
  if(def)N.push({a:"El muro",t:`${corto(def.eq)} es la defensa menos goleada`,p:`${fmt(def.gc/def.pj)} goles encajados por partido.`});
  return N;
}

function ojoJornada(){
  const pend=A.liga.filter(m=>!jugado(m)&&m.visitante!=="DESCANSA").sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(!pend.length)return null;

  const cands=A.liga.filter(m=>m.jornada===j&&!jugado(m)&&m.visitante!=="DESCANSA"&&m.local!==PUFF&&m.visitante!==PUFF);
  if(!cands.length)return null;
  const yo=TAB.find(x=>x.eq===PUFF);
  const cerca=t=>{const x=TAB.find(y=>y.eq===t);return Math.max(0,6-Math.abs(x.pts-yo.pts))};
  const sc=m=>cerca(m.local)+cerca(m.visitante)+(TOP5.includes(m.local)&&TOP5.includes(m.visitante)?2:0);
  const m=cands.slice().sort((a,b)=>sc(b)-sc(a))[0];

}

const enMarco=(()=>{try{return window.self!==window.top}catch(e){return true}})();
if(!enMarco&&"serviceWorker" in navigator&&location.protocol==="https:"){

(function(){

  if(ios)setTimeout(()=>ver("<b>Instala Puff FC</b>Toca el botón Compartir y luego \u00abAñadir a pantalla de inicio\u00bb."),1500);
  else setTimeout(()=>{if(!evento)ver("<b>Instala Puff FC</b>Abre el menú del navegador y elige \u00abInstalar aplicación\u00bb o \u00abAñadir a pantalla de inicio\u00bb.")},4000);
  btn.addEventListener("click",async()=>{if(!evento)return;evento.prompt();try{await evento.userChoice}catch(e){}evento=null;caja.classList.remove("ver")});
  document.getElementById("instalar-x").addEventListener("click",()=>{caja.classList.remove("ver");try{localStorage.setItem("puff-instalar-no","1")}catch(e){}});

(function(){
  if(enMarco)return;
  const APP="75b396da-67e2-4355-bea9-851fb3a59902";
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  const sc=document.createElement("script");sc.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";sc.defer=true;document.head.appendChild(sc);
  const caja=document.getElementById("avisos"),btn=document.getElementById("avisos-btn");
  const pie=document.getElementById("pie");
  OneSignalDeferred.push(async OS=>{
    const estado=t=>{let el=document.getElementById("avisos-estado");if(!el){el=document.createElement("p");el.id="avisos-estado";el.className="nota";pie.appendChild(el)}el.textContent=t};
    try{await OS.init({appId:APP,safari_web_id:"web.onesignal.auto.3145fc89-5d6b-4727-99ef-e9ab80472582",serviceWorkerPath:"sw.js",serviceWorkerParam:{scope:"/"},notifyButton:{enable:false},promptOptions:{autoPrompt:false}})}catch(e){estado("Avisos: error al arrancar ("+(e&&e.message||e)+")");return}
    if(!OS.Notifications.isPushSupported()){const st=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;estado(st?"Avisos: este móvil no los admite (en iPhone hace falta iOS 16.4 o más)":"Avisos: abre la app desde el icono de la pantalla de inicio para activarlos");return}
    if(OS.User.PushSubscription.optedIn)estado("Avisos activados en este móvil.");
    const dentro=()=>OS.User.PushSubscription.optedIn;
    let enlace=null;
    /* El permiso se pide con la API del propio móvil, dentro del toque (iPhone lo exige), y luego se suscribe en OneSignal */
    const pedir=async()=>{
      let p="";try{p=await Notification.requestPermission()}catch(e){estado("Avisos: el móvil no deja pedir permiso ("+e.message+")");return}
      if(p!=="granted"){estado("Avisos: permiso "+(p==="denied"?"denegado. Actívalo en Ajustes > Notificaciones > Puff FC":"no concedido"));pintar();return}
      try{await OS.User.PushSubscription.optIn()}catch(e){estado("Avisos: error al suscribirse ("+e.message+")");return}
      setTimeout(()=>{estado(dentro()?"Avisos activados. Ya te llegarán las notificaciones.":"Avisos: permiso dado, pero falta completar la suscripción. Cierra y abre la app.");pintar()},1500);
    };
    function pintar(){
      const on=dentro(),neg=OS.Notifications.permissionNative==="denied";
      if(on||neg){caja.classList.remove("ver");if(enlace)enlace.remove();enlace=null;return}
      if(!enlace){enlace=document.createElement("button");enlace.className="chip";enlace.style.marginTop="10px";enlace.textContent="Activar avisos de Puff FC";enlace.addEventListener("click",pedir);pie.appendChild(document.createElement("br"));pie.appendChild(enlace)}
      let no=false;try{no=localStorage.getItem("puff-avisos-no")==="1"}catch(e){}
      if(!no&&!document.getElementById("instalar").classList.contains("ver"))caja.classList.add("ver");
    }
    btn.addEventListener("click",async()=>{caja.classList.remove("ver");await pedir()});
    document.getElementById("avisos-x").addEventListener("click",()=>{caja.classList.remove("ver");try{localStorage.setItem("puff-avisos-no","1")}catch(e){}});
    OS.User.PushSubscription.addEventListener("change",pintar);
    setTimeout(pintar,2000);
  });
})();
})();
